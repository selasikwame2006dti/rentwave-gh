<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="RentWave GH mark">
  <defs>
    <linearGradient id="rwWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5b7"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="rwGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb703"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
  </defs>

  <!-- wave echo (behind house) -->
  <path d="M58 212 C 84 196, 106 226, 132 212 S 176 198, 196 212"
        fill="none" stroke="#0ea5b7" stroke-width="11"
        stroke-linecap="round" opacity="0.35"/>

  <!-- house: roof + walls, open base (the wave takes its place) -->
  <g fill="none" stroke="#0b2239" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 150 L120 82 L190 150"/>
    <path d="M66 137 V186"/>
    <path d="M174 137 V186"/>
  </g>

  <!-- main wave through the base -->
  <path d="M34 190 C 62 168, 88 212, 118 190 S 168 168, 208 190"
        fill="none" stroke="url(#rwWave)" stroke-width="15" stroke-linecap="round"/>

  <!-- sun -->
  <circle cx="176" cy="52" r="11" fill="url(#rwGold)"/>
</svg>
