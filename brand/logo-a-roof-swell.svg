<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <clipPath id="rwcA"><rect width="128" height="128" rx="30"/></clipPath>
  </defs>

  <!-- Concept A: ROOF + SWELL - house roof over a rising wave -->
  <g clip-path="url(#rwcA)">
    <rect width="128" height="128" fill="#0b2239"/>

    <!-- deep water band -->
    <path d="M-4,96 C 14,78 34,78 54,96 C 74,114 96,114 132,96 L 132,136 L -4,136 Z" fill="#0e5f6e"/>

    <!-- roof chevron -->
    <path d="M64,24 L97,52 L97,60 L64,40 L31,60 L31,52 Z" fill="#ffffff"/>

    <!-- W monogram riding the wave (stroked) -->
    <path d="M38,58 L50,90 L64,68 L78,90 L90,58" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- foam crest line -->
    <path d="M-4,96 C 14,78 34,78 54,96 C 74,114 96,114 132,96" fill="none" stroke="#ffb703" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
